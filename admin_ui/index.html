<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>MeowBuddy Admin</title>
  <style>
    :root {
      --bg: #f5f3fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --brand: #7b61ff;
      --brand-weak: #efeaff;
      --border: #e5e7eb;
      --shadow: 0 10px 30px rgba(31, 41, 55, 0.08);
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 600px at 10% 0%, #efeaff 0%, #f5f3fb 45%, #f7f7fb 100%);
    }

    .page {
      max-width: 980px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--brand);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      box-shadow: 0 8px 16px rgba(123, 97, 255, 0.3);
    }

    .title {
      font-size: 22px;
      font-weight: 700;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 13px;
      color: #374151;
    }

    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }

    input:focus, textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(123, 97, 255, 0.15);
    }

    .full {
      grid-column: 1 / -1;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    button {
      padding: 10px 16px;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      transition: transform 0.05s ease;
    }

    button:active { transform: translateY(1px); }

    .status {
      margin-top: 10px;
      font-size: 14px;
    }

    .status.info { color: var(--muted); }
    .status.error { color: #d93025; }
    .status.success { color: #188038; }

    .section-title {
      margin: 26px 0 12px;
      font-size: 16px;
      font-weight: 700;
    }

    .notice {
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 12px;
      background: #fff;
      margin-top: 10px;
    }

    .notice-title {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .notice-meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .pill {
      display: inline-flex;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--brand-weak);
      color: var(--brand);
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div class="brand">
        <div class="logo">MB</div>
        <div>
          <div class="title">MeowBuddy Admin</div>
          <div class="subtitle">Publish notices to your FastAPI server</div>
        </div>
      </div>
      <span class="pill">Admin UI</span>
    </div>

    <div class="card">
      <div class="grid">
        <div>
          <label for="apiBase">API Base URL</label>
          <input id="apiBase" type="text" placeholder="https://api.example.com" value="http://127.0.0.1:8000" />
        </div>

        <div>
          <label for="secret">Admin Secret</label>
          <input id="secret" type="password" placeholder="Enter admin secret" />
        </div>

        <div class="full">
          <label for="title">Title</label>
          <input id="title" type="text" placeholder="공지 제목" />
        </div>

        <div class="full">
          <label for="content">Content</label>
          <textarea id="content" rows="6" placeholder="공지 내용을 입력하세요"></textarea>
        </div>
      </div>

      <div class="actions">
        <button onclick="publish()">Publish</button>
        <div id="status" class="status info"></div>
      </div>
    </div>

    <div class="section-title">Latest Notices</div>
    <div id="notices" class="muted">No notices yet.</div>
  </div>

  <script>
    function apiBase() {
      const val = document.getElementById('apiBase').value.trim();
      return val.replace(/\/+$/, '');
    }

    async function publish() {
      const base = apiBase();
      const secret = document.getElementById('secret').value;
      const title = document.getElementById('title').value;
      const content = document.getElementById('content').value;
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Publishing...';
      statusEl.className = 'status info';
      try {
        const resp = await fetch(base + '/admin/notices', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Secret': secret
          },
          body: JSON.stringify({ title, content })
        });
        if (!resp.ok) {
          const txt = await resp.text();
          throw new Error(txt || resp.statusText);
        }
        statusEl.textContent = 'Published!';
        statusEl.className = 'status success';
        document.getElementById('title').value = '';
        document.getElementById('content').value = '';
        loadNotices(secret);
      } catch (err) {
        statusEl.textContent = 'Failed: ' + err;
        statusEl.className = 'status error';
      }
    }

    async function loadNotices(secret) {
      const base = apiBase();
      const container = document.getElementById('notices');
      container.textContent = 'Loading...';
      try {
        const resp = await fetch(base + '/admin/notices', {
          headers: { 'X-Admin-Secret': secret }
        });
        if (!resp.ok) throw new Error(await resp.text());
        const data = await resp.json();
        if (!data.length) {
          container.textContent = 'No notices yet.';
          return;
        }
        container.innerHTML = '';
        data.forEach(n => {
          const div = document.createElement('div');
          div.className = 'notice';
          div.innerHTML = '<div class="notice-title">' + n.title + '</div>' +
            '<div class="notice-meta">' + n.created_at + '</div>' +
            '<div>' + n.content + '</div>';
          container.appendChild(div);
        });
      } catch (err) {
        container.textContent = 'Failed to load notices: ' + err;
      }
    }

    document.getElementById('secret').addEventListener('blur', (e) => {
      const secret = e.target.value;
      if (secret) loadNotices(secret);
    });
  </script>
</body>
</html>
